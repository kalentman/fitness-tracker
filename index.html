<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><meta name="description" content="Προσωπικό πρόγραμμα άσκησης 8 εβδομάδων"><link rel="manifest" href="manifest.webmanifest"><title>Fitness Tracker</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#16283b;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102a43;color:white;padding:22px 18px}main{max-width:780px;margin:auto;padding:16px}h1{margin:0;font-size:1.6rem}h2{font-size:1.15rem}.sub{opacity:.8;font-size:.85rem}.card{background:white;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #16324f12}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eaf2f8;border-radius:12px;padding:12px;font-size:.8rem}.stat strong{display:block;font-size:1.15rem;margin-top:4px}button{border:0;border-radius:10px;padding:11px 14px;background:#1765a2;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e7eff6;color:#153957}button:disabled{opacity:.35}nav{display:flex;gap:6px;margin:15px 0}nav button{flex:1;font-size:.83rem;padding:11px 5px}nav button:not(.active){background:#dce7ef;color:#193b56}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.row:last-child{border:0}.muted{color:#64778a;font-size:.82rem}.weeknav{display:flex;justify-content:space-between;align-items:center}input[type=checkbox]{width:23px;height:23px;accent-color:#147b6b}input[type=number],textarea,select{border:1px solid #c6d5e0;border-radius:9px;padding:11px;font:inherit;width:100%}textarea{min-height:76px}label{display:block;font-weight:600;margin:12px 0 6px}.bar{height:12px;border-radius:20px;background:#dce8ee;overflow:hidden}.fill{height:100%;background:#147b6b}.exercise{padding:8px 0;border-bottom:1px solid #eee}.warning{border-left:4px solid #d79522;padding-left:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}footer{text-align:center;color:#64778a;font-size:.75rem;padding:20px} @media(max-width:370px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>🏐 My Fitness Tracker</h1><div class="sub">8 εβδομάδες · 26/10–20/12/2026 · Offline</div></header><main><section class="grid"><div class="stat">Αφετηρία<strong>93,15 kg</strong></div><div class="stat">Τελευταίο βάρος<strong id="lastWeight">—</strong></div><div class="stat">Στόχος<strong>83,15 kg</strong></div></section><nav><button data-tab="schedule" class="active">Πρόγραμμα</button><button data-tab="weight">Βάρος</button><button data-tab="progress">Πρόοδος</button></nav><div id="content"></div></main><footer>Τα δεδομένα αποθηκεύονται μόνο σε αυτή τη συσκευή. Κράτα αντίγραφα ασφαλείας.</footer><script>
const KEY='fitness_tracker_2026_v1';const initial={week:1,checks:{},weights:{},pain:{},notes:{}};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=structuredClone(initial)}let tab='schedule';const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};const $=id=>document.getElementById(id);const dates=w=>{let a=new Date(2026,9,26+(w-1)*7),b=new Date(2026,10,1+(w-1)*7);return `${a.toLocaleDateString('el-GR',{day:'numeric',month:'short'})} – ${b.toLocaleDateString('el-GR',{day:'numeric',month:'short'})}`};const runs=[15,18,20,18,23,25,28,25];const sessions=[['tue','Τρίτη','21:30','Βόλεϊ'],['thu','Πέμπτη','07:50–08:30','Ενδυνάμωση'],['fri','Παρασκευή','17:30–18:00','Αερόβια στο στάδιο'],['sat','Σάββατο','18:00','Βόλεϊ'],['sun','Κυριακή','18:00','Αγώνας']];const ex=[['Kettlebell Romanian Deadlift','10'],['Κωπηλατική με λάστιχο','12'],['Push-ups','8–12'],['Squat σε καρέκλα (ανώδυνο βάθος)','10'],['Bird Dog','8 ανά πλευρά'],['Άρσεις γάμπας','15']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=()=>Object.values(data.checks).filter(Boolean).length;function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const ww=Object.keys(data.weights).map(Number).sort((a,b)=>b-a);$('lastWeight').textContent=ww.length?`${data.weights[ww[0]]} kg`:'—';let h='';if(tab==='schedule'){const w=data.week;h=`<section class="card"><div class="weeknav"><button class="secondary" id="prev" ${w===1?'disabled':''}>‹</button><div style="text-align:center"><strong>Εβδομάδα ${w}/8</strong><div class="muted">${dates(w)}</div></div><button class="secondary" id="next" ${w===8?'disabled':''}>›</button></div>${sessions.map(([id,day,time,name])=>`<div class="row"><div><strong>${day} · ${name}</strong><div class="muted">${time}${id==='fri'?` · ${runs[w-1]}' τρέξιμο + 10' περπάτημα`:''}</div></div><input type="checkbox" data-check="${w}-${id}" ${data.checks[w+'-'+id]?'checked':''} aria-label="Ολοκληρώθηκε ${day}"></div>`).join('')}</section><section class="card"><h2>Πέμπτη · Ασκήσεις</h2><div class="muted">5' προθέρμανση · 45–75'' διάλειμμα · ένταση 6–7/10</div>${ex.map(([n,r],i)=>`<div class="exercise">${i+1}. ${n}<div class="muted">${w<=2?2:i<3&&w!==4&&w!==8?3:2} × ${r}</div></div>`).join('')}<p class="muted">Εβδομάδες 4 και 8: ελαφρύτερη προπόνηση. Μην κάνεις squat σε επώδυνο βάθος.</p></section><section class="card"><h2>Παρασκευή · Τρέξιμο</h2><p>5' περπάτημα + <strong>${runs[w-1]}' χαλαρό τρέξιμο</strong> + 5' περπάτημα.</p><p class="muted">Επίπεδο στάδιο, ρυθμός συζήτησης. Αν ενοχλεί το γόνατο, αντικατάστησε με ανώδυνο περπάτημα.</p></section><section class="card"><label for="pain">Ενόχληση γονάτου (0–10)</label><input id="pain" type="range" min="0" max="10" value="${data.pain[w]??0}"><strong id="painVal">${data.pain[w]??0}/10</strong><label for="notes">Σημειώσεις εβδομάδας</label><textarea id="notes" placeholder="Ύπνος, κόπωση, απόδοση...">${esc(data.notes[w])}</textarea><button id="saveNotes">Αποθήκευση σημειώσεων</button></section>`}else if(tab==='weight'){h=`<section class="card"><h2>Καταγραφή βάρους</h2><label for="weightWeek">Εβδομάδα</label><select id="weightWeek">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${data.week===i+1?'selected':''}>${i+1}</option>`).join('')}</select><label for="weight">Βάρος σε kg</label><input id="weight" type="number" step="0.01" min="40" max="250" placeholder="π.χ. 92.60"><p><button id="saveWeight">Αποθήκευση μέτρησης</button></p>${Array.from({length:8},(_,i)=>`<div class="row"><span>Εβδομάδα ${i+1}</span><strong>${data.weights[i+1]?data.weights[i+1]+' kg':'—'}</strong></div>`).join('')}</section>`}else{h=`<section class="card"><h2>Πρόοδος</h2><div class="row"><span>Ολοκληρωμένες δραστηριότητες</span><strong>${total()}/40</strong></div><div class="bar"><div class="fill" style="width:${total()/40*100}%"></div></div><div class="row"><span>Μετρήσεις βάρους</span><strong>${Object.keys(data.weights).length}/8</strong></div><div class="row"><span>Μεταβολή βάρους</span><strong>${ww.length?(data.weights[ww[0]]-93.15).toFixed(2)+' kg':'—'}</strong></div><h2>Αντίγραφο ασφαλείας</h2><div class="actions"><button id="export">Εξαγωγή JSON</button><button class="secondary" id="importBtn">Εισαγωγή JSON</button></div><input type="file" id="importFile" accept="application/json,.json" hidden><p class="muted">Η εξαγωγή αποθηκεύει τις καταχωρίσεις σου σε αρχείο που μπορείς να επαναφέρεις.</p></section>`}$('content').innerHTML=h;bind()}
function bind(){if(tab==='schedule'){$('prev').onclick=()=>{data.week--;save()};$('next').onclick=()=>{data.week++;save()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{data.checks[el.dataset.check]=el.checked;save()});$('pain').oninput=e=>$('painVal').textContent=e.target.value+'/10';$('saveNotes').onclick=()=>{data.pain[data.week]=Number($('pain').value);data.notes[data.week]=$('notes').value;save()}}else if(tab==='weight'){$('saveWeight').onclick=()=>{let n=Number($('weight').value);if(!Number.isFinite(n)||n<40||n>250){alert('Συμπλήρωσε έγκυρο βάρος.');return}data.weights[$('weightWeek').value]=n;save()}}else{$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fitness-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d||typeof d!=='object'||!d.checks||!d.weights||!Number.isInteger(d.week)||d.week<1||d.week>8)throw Error();if(confirm('Να αντικατασταθούν οι τωρινές καταχωρίσεις;')){data={...initial,...d};save()}}catch{alert('Μη έγκυρο αρχείο αντιγράφου ασφαλείας.')}}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
